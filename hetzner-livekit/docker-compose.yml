services:
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      TURN_DOMAIN: ${TURN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      - caddy_data:/caddy-data:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: redis-server --port 6379 --save "" --appendonly no

  # noise-agent (server-side DTLN noise cancellation, ./agent) was tried and abandoned —
  # not usable in practice. Deliberately not defined here anymore: `docker compose up -d`
  # (no service name) brings up every service in this file, so leaving a stopped-but-still-
  # defined service around is how it silently came back once already. The code is kept in
  # ./agent for reference; re-add a service block here if it's ever revived on purpose.

volumes:
  caddy_data:
  caddy_config:
